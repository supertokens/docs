extends: spelling
level: error
message: "This word is not recognized: '%s'"
filters:
  - "passwordless"
  - "Passwordless"
  - "serverless"
  - "authorizer"
  - "validator"
  - "middleware"
  - "boolean"
  - "multitenancy"
  - "Multitenancy"
  - "stylable"
  - "serializable"
  - "shearable"
  - "refetched"
  - "liveness"
  - "embeddable"
  - "reachability"
  - "onboarding"
  - "refetching"
  - "refetch"
  - "Authorizer"
  - "upsert"
  - "Upsert"
  - "cron"
  - "Cron"
  # Abbreviations
  - "SDK[s]"
  - "SDK's"
  - "OTP[s]"
  - "API[s]"
  - "API's"
  - "JWT[s]"
  - "URI[s]"
  - "URL[s]"
  - "MAU[s]"
  - "XMLHTTPRequest"
  - "XML"
  - "IP[s]"
  - "DOM[s]"
  - "HTTPS"
  - "VPN[s]"
  - "npm"
  - "TOTP"
  - "SMS"
  - "nginx"
  - "hostname"
  - "Postgres"
  - "php"
  - "golang"
  - "JWK[s]"
  - "psql"
  - "bcrypt"
  - "OAuth"
  - "Validator"
  # Corect usage for these words are enforced in words.yml
  - "config"
  - "param"
  - "tenantId"
  - "userId"
  # In some cases vale reports errors for words inside code blocks
  # This usually happens when you highlight a line
  - "contactMethod"
  - "otherFrameworks"
  - "[Uu]nlink[ing]"
  - "deduplication"
  - "Callout"
  - "uri"
  - "websocket"
  - "cli"
  - "CLI"
  - "Unverify"
  - "FDI"
  - "CDI"

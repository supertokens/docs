questions:
  - id: install-backend-sdk
    question: How do I install SuperTokens in my backend and protect an API?
    expected:
      - Official backend SDKs are available for Node.js, Python, and Go.
      - SDK initialization configures the application, the connection to SuperTokens Core, and the enabled recipes.
      - The backend must expose the SuperTokens APIs and allow the required authentication headers through CORS.
      - APIs that require login use session verification middleware, which provides access to the user ID and session information after successful verification.
    routes:
      - /quickstart/backend-setup

  - id: add-prebuilt-frontend-ui
    question: How do I add the prebuilt login UI and session handling to React, Angular, or Vue?
    expected:
      - React uses the supertokens-auth-react package, while Angular and Vue use supertokens-web-js.
      - React applications initialize their recipes and wrap the application with SuperTokensWrapper to provide authentication context.
      - The prebuilt login UI is available on the /auth route.
      - The frontend SDK adds fetch and XHR interceptors, and web sessions use HTTP-only cookies by default.
    routes:
      - /quickstart/frontend-setup

  - id: configure-core-api-keys
    question: Are Core API keys required, and how do I configure and rotate them?
    expected:
      - Core does not require an API key by default, but the backend SDK must provide one after it is configured or Core returns HTTP 401.
      - Multiple API keys are configured as a comma-separated value.
      - Each key must be at least 20 characters and may contain only alphanumeric characters, equals signs, and hyphens.
      - Multiple keys allow gradual key rotation when several backend systems communicate with Core.
    routes:
      - /platform-configuration/supertokens-core/api-keys

  - id: customize-email-delivery
    question: Which recipes send email, and can I use my own domain and templates?
    expected:
      - Email delivery configuration applies to the EmailPassword, Passwordless, and AccountLinking recipes.
      - Without custom configuration, emails come from noreply@supertokens.io and templates cannot be customized.
      - Configuring a custom SMTP server allows emails to be sent from your own domain.
      - With SMTP, the default email template and subject can optionally be customized.
    routes:
      - /platform-configuration/email-delivery

  - id: self-host-with-postgresql
    question: What are the deployment and database requirements for self-hosting SuperTokens Core?
    expected:
      - Core can be deployed with a Docker image or directly on a VM.
      - Persistent deployments support PostgreSQL 13.0 or newer, Core 11.0.0 dropped MySQL and MongoDB support, and an in-memory database is available for testing.
      - Core uses port 3567 by default, and the /hello endpoint checks both service health and database connectivity.
      - Docker can connect to PostgreSQL using either a connection URI or separate host, port, database, username, and password settings.
    routes:
      - /deployment/self-host-supertokens

  - id: use-passwordless-authentication
    question: Which passwordless methods and customizations does SuperTokens support?
    expected:
      - The Passwordless recipe authenticates users with generated Magic Links or One-Time Passwords.
      - Passwordless authentication can use the prebuilt UI or a custom interface implemented with the SDKs.
      - Magic Link creation and One-Time Password format can be customized.
      - Email and SMS delivery can be customized.
    routes:
      - /authentication/passwordless/introduction

  - id: add-social-login
    question: Can I use built-in or custom social login providers and restrict sign-ups to invited users?
    expected:
      - The ThirdParty recipe authenticates users through third-party providers.
      - The recipe supports both built-in providers and custom providers.
      - Sign-ups can be restricted to invited users with an allowlist and sign-in/up overrides.
    routes:
      - /authentication/social/introduction

  - id: use-passkeys
    question: How do passkeys work, what devices do they require, and can I customize them?
    expected:
      - Passkeys are a passwordless authentication method based on the WebAuthn specification.
      - Users can log in with biometric authentication, security keys, or device-based credentials.
      - Users need compatible devices with built-in biometric sensors or external security keys.
      - Credential generation and credential validation can be customized.
    routes:
      - /authentication/passkeys/introduction

  - id: configure-mfa
    question: Which MFA factors, step-up options, and magic-link limitations does SuperTokens have?
    expected:
      - Supported MFA factors include email or SMS OTP, TOTP, and WebAuthn or Passkeys.
      - An additional authentication challenge can be required for sensitive routes or actions.
      - Magic links work only as a first factor with the prebuilt UI, while OTP can be used as a later factor.
      - MFA is available for managed SuperTokens deployments.
    routes:
      - /additional-verification/mfa/introduction

  - id: understand-session-management
    question: How do SuperTokens sessions, token refresh, and revocation work?
    expected:
      - Signing in creates a session and issues access and refresh tokens to the frontend.
      - Protected API calls verify the access token and its expiry.
      - When the access token expires, the frontend uses the refresh token to obtain new tokens and retries the original API call.
      - Revoking a session removes its refresh token and session information, so refresh fails and the user must log in again.
    routes:
      - /post-authentication/session-management/introduction

  - id: integrate-email-password-authentication
    question: How do I integrate email password authentication?
    expected:
      - Configure the EmailPassword and Session recipes on both the frontend and backend.
      - Choose either the prebuilt UI or a custom UI and configure the authentication routes.
      - Configure the password reset flow and decide whether email verification is required.
      - Validate sign-up, sign-in, sign-out, session refresh, and password reset.
    routes:
      - /authentication/email-password/introduction

  - id: integrate-passwordless-authentication
    question: How do I integrate passwordless authentication with magic links or OTPs?
    expected:
      - Configure the Passwordless and Session recipes on both the frontend and backend.
      - Choose whether users receive credentials by email, SMS, or either method.
      - Set the flow type to MAGIC_LINK, USER_INPUT_CODE for OTPs, or USER_INPUT_CODE_AND_MAGIC_LINK to support both.
      - Configure email or SMS delivery and validate sign-in, resend, expiry, and session behavior.
    routes:
      - /authentication/passwordless/initial-setup

  - id: integrate-google-login
    question: How do I integrate Google login?
    expected:
      - Configure the ThirdParty and Session recipes and, when using the prebuilt UI, add Google to its frontend provider list.
      - Configure the backend provider with the google third-party ID and the application's Google client ID and client secret.
      - Keep the client secret out of source control and replace the documented development credentials for production.
      - Use a consistent frontend callback URL, such as /auth/callback/google, and call signInAndUp on that route.
    routes:
      - /authentication/social/initial-setup

  - id: integrate-apple-login
    question: How do I integrate Apple login?
    expected:
      - Configure the ThirdParty and Session recipes and, when using the prebuilt UI, add Apple to its frontend provider list.
      - Configure the backend apple provider with its client ID, key ID, private key, and team ID.
      - Apple sends a form POST to the backend callback instead of redirecting directly to the frontend.
      - Set redirectURIOnProviderDashboard to the backend callback and frontendRedirectURI to the frontend page that completes sign-in with signInAndUp.
    routes:
      - /authentication/social/initial-setup

  - id: integrate-custom-oauth-provider
    question: How do I integrate a custom OAuth provider?
    expected:
      - Add the custom provider to the ThirdParty provider list shown by the frontend or custom login UI.
      - Configure a stable third-party ID, provider name, client credentials, and required scopes on the backend.
      - Provide the provider's authorization, token, and user-info endpoints.
      - Map the provider's user information to the SuperTokens user ID, email, and email verification fields.
    routes:
      - /authentication/social/custom-providers

  - id: integrate-passkeys
    question: How do I integrate passkeys?
    expected:
      - WebAuthn passkey authentication is supported by the Node.js and Python backend SDKs, but not the Go SDK.
      - Configure the WebAuthn and Session recipes on both the frontend and backend.
      - Configure the authentication routes for either the prebuilt UI or a custom UI.
    routes:
      - /authentication/passkeys/initial-setup

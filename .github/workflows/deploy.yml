name: Build

on:
  pull_request:
    paths:
      - "docs/**"
      - "components/**"
      - "islands/**"
      - "openapi/**"
      - "public/**"
      - "scripts/blume/**"
      - "blume.config.ts"
      - "components.ts"
      - "microfrontends.jsonc"
      - "theme.css"
      - "tsconfig.json"
      - "vercel.json"
      - ".github/workflows/deploy.yml"
      - "package-lock.json"
      - "package.json"
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Build Blume site
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blume-build
          path: dist
          retention-days: 1

name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "scripts/format-code-blocks.ts"
      - "scripts/write-code-blocks.ts"
      - "scripts/check-code-blocks.*"
      - "scripts/code-blocks/**"
      - "scripts/code-type-checking/**"
      - "lib/api-request-snippets.ts"
      - "lib/api-request-snippets.test.ts"
      - "components/ApiRequestSnippet.astro"
      - "openapi/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/test.yml"

jobs:
  lint-code-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: npm ci

      - name: Test Code Snippet Infrastructure
        run: npm test -- --run scripts/code-blocks lib/api-request-snippets.test.ts

      - name: Lint Code Snippets
        run: npm run lint:code-blocks

  write-code-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: npm ci

      - name: Write Code Snippets
        run: npm run write-code-blocks

      - name: Upload Code Type Checking Scripts
        uses: actions/upload-artifact@v4
        with:
          name: code-blocks
          path: scripts/code-type-checking/*/snippets
          retention-days: 1

  code-type-checking:
    needs: write-code-blocks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language:
          - javascript
          - go
          - python
          - swift
          - php
          - java
          - csharp
          # TODO: Check kotlin issues
          # - kotlin
          # TODO: Repair the Dart checker before enabling it
          # - dart
    steps:
      - uses: actions/checkout@v4

      - name: Download Code Blocks
        uses: actions/download-artifact@v4
        with:
          name: code-blocks
          path: ./scripts/code-type-checking

      - uses: docker/setup-buildx-action@v3

      - name: Check code snippets for ${{ matrix.language }}
        run: ./scripts/check-code-blocks.sh ${{ matrix.language }}

name: Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "islands/**/*.tsx"
      - "CONTRIBUTING.md"
      - ".vale.ini"
      - ".vale/**"
      - ".github/workflows/lint.yml"

jobs:
  vale-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdx2vast
        run: npm install -g mdx2vast

      - name: Get changed files
        id: changed-doc-files
        uses: tj-actions/changed-files@v46.0.3
        with:
          files_yaml: |
            content:
              - "docs/**/*.md"
              - "docs/**/*.mdx"
              - "islands/**/*.tsx"
              - "CONTRIBUTING.md"
            config:
              - ".vale.ini"
              - ".vale/**"
              - ".github/workflows/lint.yml"
          matrix: true

      - name: Run Vale on changed content
        uses: errata-ai/vale-action@v2.1.1
        if: >-
          github.event_name != 'workflow_dispatch' &&
          steps.changed-doc-files.outputs.content_any_changed == 'true' &&
          steps.changed-doc-files.outputs.config_any_modified != 'true'
        with:
          files: ${{ steps.changed-doc-files.outputs.content_all_changed_files }}
          vale_flags: "--minAlertLevel=warning"
          version: 3.20.0
          reporter: local
          filter_mode: nofilter
          fail_on_error: true

      - name: Run full Vale validation
        uses: errata-ai/vale-action@v2.1.1
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.changed-doc-files.outputs.config_any_modified == 'true'
        with:
          files: '["docs", "components", "islands", "CONTRIBUTING.md"]'
          version: 3.20.0
          # PR reporters fetch GitHub's size-limited diff even with nofilter.
          reporter: local
          filter_mode: nofilter
          fail_on_error: true

